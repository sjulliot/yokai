services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - YOKAI_WAITING_ROOM_DISCONNECT_GRACE_SECONDS=300
      - YOKAI_CORS_ORIGINS=["*"]
    expose:
      - "8000"

  # Ce service ne fait que produire les assets statiques Vite dans le volume
  # partagé frontend_dist, puis termine (code "exited (0)", normal, pas un
  # crash). C'est le pattern le plus simple et le plus fiable ici : pas besoin
  # de garder un process (type `tail -f /dev/null`) juste pour "posséder" un
  # volume. `nginx` attend explicitement la fin réussie de cette copie via
  # `condition: service_completed_successfully` avant de démarrer.
  frontend:
    build:
      context: ./frontend
      target: export
    command: sh -c "cp -r /dist/. /shared/ && echo 'frontend assets copied'"
    volumes:
      - frontend_dist:/shared

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro

volumes:
  frontend_dist:
