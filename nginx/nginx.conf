# Reverse proxy HTTP simple pour usage local/LAN. Pas de certificats TLS
# disponibles dans cet environnement, donc pas de bloc `listen 443 ssl` ici.
#
# Pour un déploiement distant réel avec un vrai domaine :
#   - ajouter `listen 443 ssl;` et `listen [::]:443 ssl;`
#   - ajouter `ssl_certificate /etc/nginx/certs/fullchain.pem;`
#   - ajouter `ssl_certificate_key /etc/nginx/certs/privkey.pem;`
#   - rediriger le port 80 vers 443 (server{listen 80; return 301 https://$host$request_uri;})
#   - monter les certificats (ex. Let's Encrypt / certbot) en volume dans le service nginx
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws {
        proxy_pass http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
